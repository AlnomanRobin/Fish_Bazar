<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products — FishBazar Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/dashboard.css">
</head>
<body>
<nav class="navbar" id="main-navbar">
  <div class="container navbar-inner">
    <a href="../index.html" class="navbar-logo"><div class="logo-icon"><img src="../logo/Logo.png" alt="FishBazar logo"></div><div>FishBazar <span style="font-size:0.7rem;font-weight:700;color:var(--danger);text-transform:uppercase">Admin</span></div></a>
    <div class="navbar-actions"><div class="navbar-avatar" id="nav-avatar" style="background:var(--danger)">A</div></div>
  </div>
</nav>

<div class="dashboard-layout admin-dash">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><span class="sidebar-role-badge admin">🔧 Admin</span></div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sidebar-avatar" style="background:var(--danger)">A</div>
      <div><div class="sidebar-user-name" id="sidebar-name">Admin</div></div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">📊</span> Dashboard</a>
      <a href="profile.html"   class="sidebar-nav-link"><span class="sidebar-nav-icon">👤</span> Admin Profile</a>
      <a href="sellers.html"   class="sidebar-nav-link"><span class="sidebar-nav-icon">🏪</span> Sellers</a>
      <a href="customers.html" class="sidebar-nav-link"><span class="sidebar-nav-icon">👥</span> Customers</a>
      <a href="products.html"  class="sidebar-nav-link active"><span class="sidebar-nav-icon">🐟</span> Products</a>
      <a href="orders.html"    class="sidebar-nav-link"><span class="sidebar-nav-icon">📦</span> All Orders</a>
    </nav>
    <div class="sidebar-footer"><span class="sidebar-nav-link" data-action="logout" style="cursor:pointer"><span class="sidebar-nav-icon">🚪</span> Logout</span></div>
  </aside>

  <main class="dashboard-content">
    <div class="flex-between" style="margin-bottom:var(--sp-6)">
      <div>
        <h1 style="font-size:var(--fs-3xl);font-weight:800">🐟 All Products</h1>
        <p style="color:var(--text-muted)">Monitor all product listings across all sellers</p>
      </div>
    </div>

    <div class="flex gap-4" style="margin-bottom:var(--sp-5)">
      <div class="search-box" style="max-width:360px">
        <span class="search-icon">🔍</span>
        <input type="text" id="product-search" placeholder="Search products..." oninput="searchProducts()">
      </div>
      <select class="form-control" id="cat-filter" style="max-width:200px" onchange="filterByCategory()">
        <option value="">All Categories</option>
        <option value="1">🐟 Hilsa</option>
        <option value="2">🦐 Shrimp</option>
        <option value="3">🐡 Freshwater</option>
        <option value="4">🌊 Saltwater</option>
        <option value="5">🐠 Dried Fish</option>
        <option value="6">🎣 Live Fish</option>
      </select>
    </div>

    <div class="table-card">
      <div class="table-header">
        <span class="table-title">Products (<span id="product-count">0</span>)</span>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>Product</th><th>Category</th><th>Seller</th><th>Price/kg</th><th>Stock</th><th>Rating</th><th>Region</th><th>Action</th></tr>
          </thead>
          <tbody id="products-tbody">
            <tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-muted)">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { fetchAdminProducts } from '../js/api.js';
  import { requireRole, getUser } from '../js/auth.js';
  import { showToast } from '../js/main.js';
  import '../js/main.js';

  requireRole('admin');
  const user = getUser();
  if (user) {
    document.getElementById('nav-avatar').textContent     = user.name?.charAt(0).toUpperCase() || 'A';
    document.getElementById('sidebar-avatar').textContent = user.name?.charAt(0).toUpperCase() || 'A';
    document.getElementById('sidebar-name').textContent   = user.name || 'Admin';
  }

  let allProducts = [];

  async function loadProducts() {
    const res = await fetchAdminProducts();
    if (!res.ok || !res.data) return;
    allProducts = res.data;
    renderProducts(allProducts);
  }

  function renderProducts(products) {
    document.getElementById('product-count').textContent = products.length;
    const tbody = document.getElementById('products-tbody');
    if (!products.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-muted)">No products found</td></tr>'; return; }
    tbody.innerHTML = products.map(p => `
      <tr>
        <td>
          <div class="td-avatar">
            <img class="td-img" src="${p.img}" alt="${p.name_en}" onerror="this.src='https://placehold.co/42x42/0d4f5c/white?text=F'">
            <div>
              <div class="td-name">${p.name_en}</div>
              <div class="td-sub" style="font-family:var(--font-bn)">${p.name_bn}</div>
            </div>
          </div>
        </td>
        <td><span class="badge badge-muted">${p.category?.name_en || '—'}</span></td>
        <td>
          <div class="td-name">${p.seller?.shop_name || '—'}</div>
          <div class="td-sub">📍 ${p.seller?.district || ''}</div>
        </td>
        <td><strong>৳${p.price_per_kg.toLocaleString()}</strong></td>
        <td>${p.stock_kg} kg</td>
        <td>⭐ ${p.rating} <span style="color:var(--text-muted);font-size:var(--fs-xs)">(${p.reviews})</span></td>
        <td>${p.region}</td>
        <td>
          <div class="table-actions-cell">
            <a href="../product.html?slug=${p.slug}" class="btn btn-ghost btn-sm" target="_blank">👁 View</a>
            <button class="btn btn-danger btn-sm" onclick="showToast('Product removed (demo)', 'warning')">🗑️</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  window.searchProducts = function() {
    const q = document.getElementById('product-search').value.toLowerCase();
    const catId = document.getElementById('cat-filter').value;
    renderProducts(allProducts.filter(p =>
      (p.name_en.toLowerCase().includes(q) || p.name_bn.includes(q)) &&
      (!catId || p.category_id === +catId)
    ));
  };

  window.filterByCategory = window.searchProducts;

  loadProducts();
</script>
</body>
</html>
